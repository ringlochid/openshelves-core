
services:
  app:
    build: .
    container_name: library-app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16
    container_name: library-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: library_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    build: ./infra/redis
    container_name: library-redis

  worker:
    build: .
    container_name: library-worker
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
    command: celery -A celery_app worker -Q media,analytics,cleanup,default -l info

  beat:
    build: .
    container_name: library-beat
    env_file: .env
    depends_on:
      - redis
      - db
    command: celery -A celery_app beat -l info

  clamav:
    image: clamav/clamav:stable
    container_name: library-clamav
    environment:
      - CLAMD_STARTUP_TIMEOUT=120000
    # ports:
    #   - "3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav

volumes:
  pgdata:
  clamav-db:

